<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mamakilo — bien manger, vivre mieux</title>
    <meta
      name="description"
      content="Notez ce que vous mangez, suivez votre poids et vos envies de grignotage. Une mosaïque qui se remplit, pas un compteur qui culpabilise."
    />
    <!-- Une seule balise, mise à jour par appliquerApparence() : avec huit thèmes,
         deux valeurs figées par préférence système afficheraient la barre du
         navigateur en crème pendant que l'application est en violet. -->
    <meta name="theme-color" content="#FDF6EE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <!-- Les deux, et pas seulement la seconde : la balise `apple-` est celle que
         lisent les iOS antérieurs à 16.4, et c'est la moitié du parc installé
         d'une PWA. La standard fait taire l'avertissement des navigateurs
         récents ; retirer l'autre ferait perdre le plein écran sur les anciens
         iPhone, sans que rien ne le signale. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mamakilo" />

    <!-- Les polices sont servies depuis notre domaine, et ce n'est pas qu'une
         question de vitesse : une police chargée depuis fonts.gstatic.com
         transmet l'adresse IP du visiteur à Google, qui devient un destinataire
         de données — or DESTINATAIRES, dans src/lib/legal.ts, ne l'a jamais
         listé. Sur un site qui traite des données de santé, la politique de
         confidentialité doit être vraie. Voir outils/polices.mjs.

         Seuls les deux sous-ensembles latins sont préchargés. Les latin-ext ne
         se téléchargent que si un caractère les appelle, ce que gèrent les
         unicode-range de src/polices.css ; les précharger ferait payer 34 Ko à
         tout le monde pour des lettres que le français n'emploie pas. -->
    <link
      rel="preload"
      href="/polices/figtree-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/polices/faustina-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Appliqué avant le premier rendu : sans ça, un thème sombre ou coloré
         choisi dans les réglages provoque un flash de l'autre thème au
         chargement. Ces quelques lignes sont volontairement dupliquées avec
         src/lib/apparence.ts : elles doivent tourner avant le premier octet de
         JavaScript applicatif, donc elles ne peuvent pas l'importer. Les noms des
         deux clés et la liste des thèmes sont la seule chose à garder d'accord. -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('equilibre:theme')
          var sombre =
            mode === 'sombre' ||
            (mode !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (sombre) document.documentElement.classList.add('dark')

          var theme = localStorage.getItem('equilibre:palette')
          var connus = [
            'potager',
            'agrumes',
            'myrtille',
            'ocean',
            'cacao',
            'framboise',
            'encre',
          ]
          // « marmite » est le défaut et vit dans :root, sans attribut.
          if (theme && connus.indexOf(theme) !== -1)
            document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
